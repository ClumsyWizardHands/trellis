[project]
name = "trellis-harness"
version = "0.1.0"
description = "An agent harness that is a trellis, not a soul — infrastructure for contextual-witness agents built from a recorded failure doctrine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Crowell" }]
# The core has ZERO runtime dependencies (DECISIONS.md D11).
dependencies = []

[project.optional-dependencies]
# Model seats
claude = ["claude-agent-sdk>=0.1", "anyio>=4"]
openai = []          # hosted OpenAI + local (Ollama/etc.) run on stdlib urllib — no dep.
                     # Empty, kept so `pip install 'trellis-harness[openai]'` reads uniformly.
# Access surfaces
discord = []         # the read poller is stdlib urllib — no dep. Empty by design.
obsidian = []        # the vault is plain-file I/O (vault.py) — no dep. Empty by design.
google = ["google-api-python-client>=2", "google-auth-oauthlib>=1"]  # the one dep-bearing surface
# Surfaces / dev
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]   # httpx: FastAPI TestClient (web auth tests)
# Convenience aggregate
all = ["trellis-harness[claude,web,google]"]

[project.scripts]
trellis = "trellis.cli:main"
trellis-web = "web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trellis*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
