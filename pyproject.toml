[project]
name = "trellis-harness"
version = "0.1.0"
description = "An agent harness that is a trellis, not a soul — infrastructure for contextual-witness agents built from a recorded failure doctrine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Crowell" }]
# The core has ZERO runtime dependencies (DECISIONS.md D11).
dependencies = []

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1", "anyio>=4"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
trellis-web = "web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trellis*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
