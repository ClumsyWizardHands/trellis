name: CI

# Codex audit Medium 15/16: generate counts in CI (don't hardcode drifting
# numbers), pin the interpreter (bare `python3` resolves to 3.9 on some machines),
# and smoke-test a clean-environment install. The suite is the gate; the stress
# script exits non-zero on any regression, so it gates too.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (clean-env smoke test of the packaging)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[web,dev]'
      - name: Acceptance suite (the ten unforgivables)
        run: python -m pytest -q
      - name: Adversarial stress (10 scenarios; exits non-zero on any break)
        run: python stress/stress_test.py
